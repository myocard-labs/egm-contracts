# ---------------------------------------------------------------------------
# pyproject.toml — myocard-egm-contracts
#
# Cross-language data-format schemas + validators for the myocard-labs
# intracardiac EGM project. JSON-Schema-first: every format is declared in
# src/myocard_egm_contracts/schemas/*.schema.json; Pydantic models (Python)
# and C++ structs (eventually) are codegen'd from the same source.
#
# See:
#   - intracardiac-platform/project/refactor_checklist.md (Phase 1 / egm-contracts)
#   - feedback-schemas-json-schema-first memory
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myocard-egm-contracts"
version = "0.5.1"
description = "Cross-language schemas + validators for the myocard-labs intracardiac EGM data formats."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Daniel Klein", email = "daniel.anthony.klein.88@gmail.com" },
]
keywords = ["cardiac", "electrophysiology", "signal-processing", "egm", "schema", "json-schema"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "h5py>=3.10",
  "jsonschema>=4.20",
  "numpy>=1.26,<2.5",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "datamodel-code-generator==0.64.0",
  "mypy==2.1.0",
  "nbstripout>=0.7",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.15.17",
]

[project.urls]
Homepage      = "https://github.com/myocard-labs/intracardiac-platform"
Repository    = "https://github.com/myocard-labs/egm-contracts"
Issues        = "https://github.com/myocard-labs/egm-contracts/issues"
Organization  = "https://github.com/myocard-labs"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/myocard_egm_contracts"]
# Ship the JSON Schema source files in the wheel so consumers / validators
# can read them at runtime via importlib.resources. Also ship the py.typed
# marker so downstream consumers (e.g. myocard-egm-data) can mypy-check
# imports from this package.
artifacts = [
  "src/myocard_egm_contracts/schemas/*.schema.json",
  "src/myocard_egm_contracts/_generated/python/*.py",
  "src/myocard_egm_contracts/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "codegen/",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Generated code is not edited by hand — exclude from lint to avoid pinning
# datamodel-code-generator's output to the ruff config.
extend-exclude = ["src/myocard_egm_contracts/_generated/**"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["src/myocard_egm_contracts"]
branch = true
omit = ["src/myocard_egm_contracts/_generated/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]
# Generated Pydantic models are accepted as-is; don't strict-check them
# (datamodel-code-generator's output is not always strict-clean).
exclude = ["src/myocard_egm_contracts/_generated/"]

[[tool.mypy.overrides]]
module = ["h5py.*", "jsonschema.*"]
ignore_missing_imports = true
